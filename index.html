<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loose Ends</title>
  <link rel="icon" href="/assets/Simly.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/tokens.css">
  <script>
    /* Runs before paint so there's no flash of the intro replaying.
       sessionStorage, not localStorage — plays again each new visit
       (new tab/window), not just once ever on this browser. */
    if (sessionStorage.getItem('loose-ends-intro-seen')) {
      document.documentElement.classList.add('skip-intro');
    } else {
      sessionStorage.setItem('loose-ends-intro-seen', '1');
    }
  </script>
  <style>
    html.skip-intro .epigraph {
      display: none;
    }
    html.skip-intro .page-content {
      opacity: 1;
      animation: none;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space-6);
    }

    /* epigraph and page-content share one grid cell (stacked, not
       side-by-side) so both land in exactly the same centered spot on
       the page — no separate top-pinned/bottom-centered layouts to
       keep in sync. */
    .stage {
      display: grid;
    }
    .epigraph, .page-content {
      grid-area: 1 / 1;
      align-self: center;
      justify-self: center;
    }

    /* intro flourish — plays once per visit, fully gone before the real
       page starts appearing (no crossfade). */
    .epigraph {
      text-align: center;
      opacity: 0;
    }
    .epigraph-text {
      max-width: 850px;
      margin: 0 auto;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(1.5rem, 4vw, 2.75rem);
      line-height: 1.35;
      letter-spacing: -0.005em;
      color: var(--ink);
    }
    .epigraph-wink {
      display: block;
      width: 48px;
      height: 48px;
      margin: var(--space-6) auto 0;
    }
    @media (prefers-reduced-motion: no-preference) {
      .epigraph {
        animation: epigraph-cycle 5400ms ease-in-out forwards;
      }
    }
    @keyframes epigraph-cycle {
      0%   { opacity: 0; }
      22%  { opacity: 1; }
      78%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* the real page — visible by default; only animates for visitors who
       allow motion, and only starts once the epigraph has fully finished
       (delay matches the epigraph's total 5400ms exactly). */
    .page-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 1;
    }
    @media (prefers-reduced-motion: no-preference) {
      .page-content {
        opacity: 0;
        animation: fade-in 800ms ease-out 5400ms forwards;
      }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .rooms-nav {
      max-width: 900px;
    }
    .page-wink {
      width: 48px;
      height: 48px;
      margin-top: var(--space-7);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="epigraph">
      <p class="epigraph-text">We swore we tied up every loose end, but you left our story running in an infinite loop. Turns out you can't just comment out the mess and pretend the code is clean.</p>
      <img class="epigraph-wink" src="/assets/Simly.webp" alt="" aria-hidden="true">
    </div>

    <div class="page-content">
      <nav class="rooms-nav" aria-label="Rooms">
        <ul class="big-nav">
          <li><h2><a href="/writings/">Writings</a></h2></li>
          <li><h2><a href="/og-studio/">OG Studio</a></h2></li>
          <li><h2><a href="/web-animations/">Web Animations</a></h2></li>
        </ul>
      </nav>
      <img class="page-wink" src="/assets/Simly.webp" alt="Loose Ends">
    </div>
  </div>
</body>
</html>
