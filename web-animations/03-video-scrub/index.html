<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../media/placeholder.webp" type="image/webp">
  <title>03 Video Scrub · Loose Ends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shell/lab.css">
  <style>
    .stage video, .stage canvas { position: absolute; inset: var(--hud-top) 0 var(--hud-bottom); width: 100%; height: calc(100% - var(--hud-top) - var(--hud-bottom)); }
    body.hud-hidden .stage video, body.hud-hidden .stage canvas { inset: 0; height: 100%; }
    .stage video { object-fit: var(--fit, contain); }
    .source-bar { position: fixed; right: 20px; top: calc(var(--hud-top) + 16px); z-index: 80; display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(14, 18, 28, 0.88); border: 1px solid var(--border-hud); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); font-size: 12px; color: var(--text-muted); }
    .source-bar strong { color: var(--text-main); font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body.hud-hidden .source-bar { display: none; }
    .drop-hint { position: fixed; inset: 0; z-index: 85; display: none; place-items: center; background: rgba(0, 0, 0, 0.6); border: 2px dashed var(--ui-accent); font-size: 18px; font-weight: 600; color: var(--ui-accent); pointer-events: none; }
    body.dragging .drop-hint { display: grid; }
  </style>
</head>
<body class="theme-teal-ink">
  <main class="stage" id="stage" aria-label="Video scrubber: scroll or drag to move through the video frame by frame">
    <video id="video" muted playsinline preload="auto" hidden></video>
    <canvas id="pattern"></canvas>
  </main>
  <div class="source-bar" id="sourceBar">
    <span>Source</span><strong id="sourceName">Test pattern</strong>
    <label class="action" for="file">Choose video…</label>
    <input id="file" type="file" accept="video/*" hidden>
    <button class="action" type="button" id="usePattern" hidden>Test pattern</button>
  </div>
  <div class="drop-hint" aria-hidden="true">Drop a video to scrub it (stays on this computer)</div>
  <script type="module" src="./module.js"></script>
</body>
</html>
